
name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SonarScanner
        shell: pwsh
        run: |
          dotnet tool install dotnet-sonarscanner --tool-path .sonar/scanner
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & ".\.sonar\scanner\dotnet-sonarscanner.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Begin SonarQube Analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          & ".\.sonar\scanner\dotnet-sonarscanner.exe" begin '/k:mi-proyecto-calidad' "/d:sonar.host.url=$env:SONAR_HOST_URL" "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build project
        run: dotnet build --configuration Release --no-incremental

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: End SonarQube Analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          & ".\.sonar\scanner\dotnet-sonarscanner.exe" end "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
