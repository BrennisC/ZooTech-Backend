# NOTA: En CI/CD el projectKey y projectName se inyectan dinamicamente
# via linea de comando (-Dsonar.projectKey / -Dsonar.projectName).
# Este archivo sirve como fallback para analisis locales.


sonar.projectKey=com.zootech.backend
sonar.projectName=ZooTech Backend

sonar.sourceEncoding=UTF-8

# Código fuente
sonar.sources=src

# Tests
sonar.tests=tests

# Exclusiones
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/Generated/**

# Tests
sonar.test.inclusions=**/*Tests.cs

# Cobertura .NET
sonar.cs.opencover.reportsPaths=coverage/**/coverage.opencover.xml